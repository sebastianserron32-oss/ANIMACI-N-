<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Series animadas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&display=block" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #1e2440; }
  #stage {
    position: relative; width: 1080px; height: 1920px; overflow: hidden;
    background: radial-gradient(ellipse 90% 60% at 50% 45%, #262d4d 0%, #1e2440 70%);
  }
  #grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.055) 2px, transparent 2px),
      linear-gradient(90deg, rgba(255,255,255,0.055) 2px, transparent 2px);
    background-size: 60px 60px; background-position: 30px 0;
    -webkit-mask-image: radial-gradient(ellipse 85% 70% at 50% 45%, #000 40%, transparent 100%);
            mask-image: radial-gradient(ellipse 85% 70% at 50% 45%, #000 40%, transparent 100%);
  }
  svg { position: absolute; inset: 0; }
  text { font-family: 'Montserrat', 'Liberation Sans', Arial, sans-serif; }
</style>
</head>
<body>
<div id="stage">
  <div id="grid"></div>
  <svg id="svg" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
        <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
      </filter>
      <clipPath id="micClip"><rect x="-110" y="-95" width="80" height="125" rx="40"/></clipPath>
    </defs>
    <g id="camera">
      <g id="links"></g>
      <g id="circles"></g>
      <g id="items"></g>
      <g id="dots"></g>
      <g id="titleG">
        <text id="title" x="540" y="1640" text-anchor="middle" font-weight="900" font-size="76" fill="#ffffff">NUESTRAS <tspan fill="#c4a35a">SERIES</tspan></text>
        <rect id="titleRule" x="450" y="1675" width="180" height="7" rx="3.5" fill="#c4a35a"/>
      </g>
    </g>
  </svg>
</div>

<script>
const DURATION = 10;
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
const mk = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const NAVY = '#1e2440', NAVY_D = '#141a30', GOLD = '#c4a35a', GOLD_D = '#a8873f', GOLD_L = '#e0c27c', LIGHT = '#cfd5e2', WHITE = '#ffffff';

// ====== DATOS (edita aquí) ======
const SERIES = [
  { name: 'AUDIOVISUAL', icon: 'av' },
  { name: 'INTERACTIVA', icon: 'tap' },
  { name: 'TESTIMONIOS', icon: 'talk' },
  { name: 'INFORMATIVA', icon: 'scroll' },
];
// Fase 1: zig-zag vertical. Fase 2: composición de 4 círculos.
const POS1 = [[320, 380], [760, 740], [320, 1100], [760, 1460]];
const CC = [540, 930], OFF = 190, CR = 240;
const POS2 = [[CC[0] - OFF, CC[1] - OFF], [CC[0] + OFF, CC[1] - OFF], [CC[0] - OFF, CC[1] + OFF], [CC[0] + OFF, CC[1] + OFF]];

// ====== Iconos ======
const ICON = {
  av(g) { // cámara + micrófono
    const cam = mk('g', {}, g);
    mk('rect', { x: -34, y: -40, width: 30, height: 104, rx: 12, fill: LIGHT }, cam);
    mk('rect', { x: -20, y: -46, width: 140, height: 112, rx: 18, fill: WHITE }, cam);
    mk('rect', { x: 22, y: -68, width: 62, height: 30, rx: 9, fill: WHITE }, cam);
    mk('rect', { x: 78, y: -34, width: 30, height: 13, rx: 5, fill: GOLD }, cam);
    mk('circle', { cx: 56, cy: 14, r: 42, fill: NAVY_D, stroke: LIGHT, 'stroke-width': 10 }, cam);
    mk('circle', { cx: 56, cy: 14, r: 29, fill: 'none', stroke: GOLD, 'stroke-width': 4 }, cam);
    mk('circle', { cx: 56, cy: 14, r: 18, fill: '#2d3a66' }, cam);
    g.glint = mk('circle', { cx: 46, cy: 3, r: 7, fill: WHITE }, cam);
    g.rec = mk('circle', { cx: 0, cy: -28, r: 7, fill: '#ff5a5f' }, cam);
    const mic = mk('g', {}, g);
    mk('rect', { x: -79, y: 20, width: 14, height: 60, fill: LIGHT, stroke: NAVY, 'stroke-width': 5 }, mic);
    mk('rect', { x: -108, y: 74, width: 72, height: 16, rx: 8, fill: LIGHT, stroke: NAVY, 'stroke-width': 5 }, mic);
    mk('rect', { x: -110, y: -95, width: 80, height: 125, rx: 40, fill: LIGHT, stroke: NAVY, 'stroke-width': 6 }, mic);
    const grille = mk('g', { 'clip-path': 'url(#micClip)', stroke: NAVY, 'stroke-width': 5 }, mic);
    [-62, -38, -14, 10].forEach(y => mk('line', { x1: -112, y1: y, x2: -28, y2: y }, grille));
    mk('line', { x1: -70, y1: -95, x2: -70, y2: 30 }, grille);
    mk('rect', { x: -110, y: -95, width: 80, height: 125, rx: 40, fill: 'none', stroke: NAVY, 'stroke-width': 6 }, mic);
    g.waves = [0, 1].map(k => mk('path', { d: `M${-130 - k * 18},-55 Q${-150 - k * 22},-20 ${-130 - k * 18},15`, fill: 'none', stroke: GOLD, 'stroke-width': 6, 'stroke-linecap': 'round', opacity: 0 }, g));
  },
  tap(g) { // dedo presionando un celular
    const phone = mk('g', { transform: 'rotate(-12)' }, g);
    mk('rect', { x: -66, y: -118, width: 132, height: 236, rx: 22, fill: LIGHT }, phone);
    mk('rect', { x: -55, y: -96, width: 110, height: 186, rx: 8, fill: NAVY_D }, phone);
    mk('rect', { x: -16, y: -110, width: 32, height: 6, rx: 3, fill: NAVY }, phone);
    mk('circle', { cx: 0, cy: 104, r: 7, fill: NAVY }, phone);
    g.tiles = [];
    for (let r = 0; r < 3; r++) for (let c = 0; c < 2; c++) {
      g.tiles.push(mk('rect', { x: -42 + c * 46, y: -80 + r * 54, width: 38, height: 40, rx: 8, fill: (r + c) % 2 ? GOLD : '#3a4570' }, phone));
    }
    g.ripple = mk('circle', { cx: 2, cy: -6, r: 10, fill: 'none', stroke: GOLD_L, 'stroke-width': 6, opacity: 0 }, g);
    const hand = mk('g', {}, g); g.hand = hand;
    // contorno
    mk('line', { x1: 96, y1: 118, x2: 6, y2: 2, stroke: NAVY, 'stroke-width': 44, 'stroke-linecap': 'round' }, hand);
    mk('circle', { cx: 96, cy: 118, r: 46, fill: NAVY }, hand);
    mk('line', { x1: 96, y1: 118, x2: 6, y2: 2, stroke: WHITE, 'stroke-width': 34, 'stroke-linecap': 'round' }, hand);
    mk('circle', { cx: 96, cy: 118, r: 40, fill: WHITE }, hand);
    mk('path', { d: 'M62,104 Q48,94 44,78', fill: 'none', stroke: NAVY, 'stroke-width': 5, 'stroke-linecap': 'round' }, hand);
    mk('path', { d: 'M58,124 Q78,122 88,138', fill: 'none', stroke: NAVY, 'stroke-width': 4, 'stroke-linecap': 'round', opacity: 0.6 }, hand);
    mk('ellipse', { cx: 14, cy: 14, rx: 9, ry: 12, transform: 'rotate(-36 14 14)', fill: '#f2e3e3', stroke: NAVY, 'stroke-width': 3 }, hand);
  },
  talk(g) { // perfil hablando
    g.headG = mk('g', { transform: 'translate(-30 0) scale(1.15)' }, g);
    mk('path', { d: 'M-50,110 L-50,62 C-96,40 -104,-62 -62,-96 C-26,-126 46,-120 66,-70 C74,-52 74,-38 72,-26 L95,0 Q99,7 90,10 L76,13 L79,22 L64,30 L77,38 Q80,58 56,62 Q36,64 31,80 L31,110 Z', fill: LIGHT }, g.headG);
    g.mouth = mk('path', { d: 'M79,22 L64,30 L77,38 Z', fill: NAVY }, g.headG);
    g.wedges = [
      'M88,-22 L150,-62 L158,-46 Z',
      'M92,8 L166,-6 L166,14 Z',
      'M88,38 L150,74 L140,88 Z',
    ].map(d => mk('path', { d, fill: GOLD, transform: 'translate(-30 0) scale(1.15)' }, g));
  },
  scroll(g) { // pergamino con garabatos
    const s = mk('g', {}, g); g.scrollBody = s;
    mk('path', { d: 'M-80,-125 L70,-125 Q92,-125 92,-103 L92,75 L-58,75 L-58,-95 Z', fill: '#f4efe4', stroke: GOLD_D, 'stroke-width': 7, 'stroke-linejoin': 'round' }, s);
    mk('circle', { cx: -80, cy: -98, r: 30, fill: GOLD, stroke: GOLD_D, 'stroke-width': 7 }, s);
    mk('circle', { cx: -80, cy: -98, r: 12, fill: GOLD_D }, s);
    g.lines = [-82, -50, -18, 14].map((y, k) => {
      const w = k === 3 ? 4 : 8; let d = `M-34,${y}`;
      for (let j = 0; j < w; j++) d += ` q7,${j % 2 ? 10 : -10} 14,0`;
      return mk('path', { d, fill: 'none', stroke: NAVY, 'stroke-width': 7, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, s);
    });
    mk('rect', { x: -66, y: 62, width: 182, height: 54, rx: 27, fill: GOLD, stroke: GOLD_D, 'stroke-width': 7 }, g);
    mk('circle', { cx: -66, cy: 89, r: 27, fill: GOLD_L, stroke: GOLD_D, 'stroke-width': 7 }, g);
    mk('circle', { cx: -66, cy: 89, r: 10, fill: GOLD_D }, g);
  },
};

// ====== Construcción ======
SERIES.forEach((s, i) => {
  const item = mk('g', {}, $('items'));
  const iconWrap = mk('g', { filter: 'url(#soft)' }, item);
  const icon = mk('g', {}, iconWrap);
  ICON[s.icon](icon);
  const label = mk('g', {}, item);
  const l1 = mk('text', { x: 0, y: 0, 'text-anchor': 'middle', 'font-weight': 700, 'font-size': 28, fill: GOLD, 'letter-spacing': 10 }, label);
  l1.textContent = 'SERIE';
  const l2 = mk('text', { x: 0, y: 50, 'text-anchor': 'middle', 'font-weight': 800, 'font-size': 46, fill: WHITE, 'letter-spacing': 2 }, label);
  l2.textContent = s.name;
  const flash = mk('circle', { r: 40, fill: 'none', stroke: WHITE, 'stroke-width': 4, opacity: 0 }, $('dots'));
  const dot = mk('circle', { r: 14, fill: WHITE, opacity: 0 }, $('dots'));
  const circ = mk('circle', { cx: POS2[i][0], cy: POS2[i][1], r: CR, fill: 'none', stroke: WHITE, 'stroke-width': 6, 'stroke-linecap': 'round' }, $('circles'));
  Object.assign(s, { item, icon, label, l1, l2, flash, dot, circ });
});
const LINKS = [0, 1, 2].map(i => {
  const [ax, ay] = POS1[i], [bx, by] = POS1[i + 1];
  const len = Math.hypot(bx - ax, by - ay), ux = (bx - ax) / len, uy = (by - ay) / len;
  const A = [ax + ux * 150, ay + uy * 150], B = [bx - ux * 150, by - uy * 150];
  const line = mk('line', { x1: A[0], y1: A[1], x2: A[0], y2: A[1], stroke: 'rgba(255,255,255,0.75)', 'stroke-width': 4 }, $('links'));
  const na = mk('circle', { cx: A[0], cy: A[1], r: 9, fill: NAVY, stroke: WHITE, 'stroke-width': 4 }, $('links'));
  const nb = mk('circle', { cx: B[0], cy: B[1], r: 9, fill: NAVY, stroke: WHITE, 'stroke-width': 4 }, $('links'));
  const runner = mk('circle', { r: 8, fill: GOLD }, $('links'));
  return { A, B, line, na, nb, runner };
});
const centerDot = mk('circle', { cx: CC[0], cy: CC[1], r: 13, fill: GOLD }, $('circles'));

// ====== Easing ======
const clamp = x => Math.min(1, Math.max(0, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, p) => a + (b - a) * p;
const easeOutCubic = x => 1 - Math.pow(1 - x, 3);
const easeInOut = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const easeOutBack = (x, c1 = 1.70158) => { const c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const scaleAt = (cx, cy, s) => `translate(${cx} ${cy}) scale(${s}) translate(${-cx} ${-cy})`;

const APPEAR = i => 0.35 + i * 0.95;
const T_OUT = 5.0, T_MOVE0 = 5.15, T_MOVE1 = 6.25;

// ====== Animaciones propias de cada icono ======
function idle(s, t, on) {
  const g = s.icon;
  if (s.icon && s.name === 'AUDIOVISUAL') {
    g.rec.setAttribute('opacity', on ? (Math.floor(t * 2.5) % 2 ? 0.25 : 1) : 1);
    g.glint.setAttribute('transform', `translate(${Math.sin(t * 2) * 4} ${Math.cos(t * 2) * 3})`);
    g.waves.forEach((w, k) => { const ph = ((t * 1.6 - k * 0.3) % 1 + 1) % 1; w.setAttribute('opacity', on ? Math.sin(ph * Math.PI) : 0); w.setAttribute('transform', `translate(${-ph * 14} 0)`); });
  } else if (s.name === 'INTERACTIVA') {
    const per = 1.1, ph = on ? ((t % per) / per) : 0.6;
    const press = ph < 0.25 ? easeOutCubic(ph / 0.25) : ph < 0.4 ? 1 - (ph - 0.25) / 0.15 : 0;
    g.hand.setAttribute('transform', `translate(${(1 - press) * 22} ${(1 - press) * 30})`);
    const rp = on ? prog(ph, 0.22, 0.85) : 0;
    g.ripple.setAttribute('r', 10 + rp * 60); g.ripple.setAttribute('opacity', rp > 0 && rp < 1 ? (1 - rp) : 0);
    const k = on ? Math.floor(t / per) % 6 : -1;
    g.tiles.forEach((tile, j) => tile.setAttribute('opacity', j === k && ph < 0.6 ? 1 : 0.75));
  } else if (s.name === 'TESTIMONIOS') {
    g.wedges.forEach((w, k) => { const ph = ((t * 1.8 - k * 0.18) % 1 + 1) % 1; const v = on ? 0.35 + 0.65 * Math.sin(ph * Math.PI) : 1; w.setAttribute('opacity', v); });
    const m = on ? 0.6 + 0.4 * Math.abs(Math.sin(t * 9)) : 1;
    g.mouth.setAttribute('transform', `translate(79 22) scale(1 ${m}) translate(-79 -22)`);
  } else if (s.name === 'INFORMATIVA') {
    const a = APPEAR(3) + 0.55;
    g.lines.forEach((l, k) => {
      const len = l.getTotalLength(); const p = easeOutCubic(prog(t, a + k * 0.18, a + k * 0.18 + 0.4));
      l.setAttribute('stroke-dasharray', len); l.setAttribute('stroke-dashoffset', len * (1 - p));
    });
    const un = easeOutBack(prog(t, APPEAR(3) + 0.4, APPEAR(3) + 0.85), 1.3);
    g.scrollBody.setAttribute('transform', `translate(0 62) scale(1 ${Math.max(0.02, un)}) translate(0 -62)`);
  }
}

function render(t) {
  $('grid').style.opacity = easeOutCubic(prog(t, 0, 0.6));
  $('camera').setAttribute('transform', scaleAt(540, 960, 1 + 0.02 * easeInOut(prog(t, 6, 10))));

  const mv = easeInOut(prog(t, T_MOVE0, T_MOVE1));
  const fadeOut = 1 - prog(t, T_OUT, T_OUT + 0.3);

  SERIES.forEach((s, i) => {
    const a = APPEAR(i);
    const [tx, ty] = POS1[i];
    // punto que vuela y aterriza (como en la referencia)
    const fp = prog(t, a, a + 0.45);
    const from = i % 2 ? [1180, ty - 420] : [-100, ty - 380];
    const ctrl = [(from[0] + tx) / 2, Math.min(from[1], ty) - 260];
    const e = easeInOut(fp);
    const bx = (1 - e) ** 2 * from[0] + 2 * (1 - e) * e * ctrl[0] + e * e * tx;
    const by = (1 - e) ** 2 * from[1] + 2 * (1 - e) * e * ctrl[1] + e * e * ty;
    const land = prog(t, a + 0.45, a + 0.6);
    s.dot.setAttribute('cx', bx); s.dot.setAttribute('cy', by);
    s.dot.setAttribute('r', fp >= 1 ? 14 + land * 26 : 14);
    s.dot.setAttribute('opacity', fp > 0 && land < 1 ? 1 : 0);
    const fl = prog(t, a + 0.5, a + 1.05);
    s.flash.setAttribute('cx', tx); s.flash.setAttribute('cy', ty);
    s.flash.setAttribute('r', 40 + easeOutCubic(fl) * 140);
    s.flash.setAttribute('opacity', fl > 0 && fl < 1 ? (1 - fl) * 0.6 : 0);

    // icono: aparece, luego se mueve a la composición final con un giro
    const pop = Math.max(0, easeOutBack(prog(t, a + 0.48, a + 0.95), 2));
    const [x2, y2] = POS2[i];
    const x = lerp(tx, x2, mv), y = lerp(ty, y2, mv);
    const turn = mv > 0 && mv < 1 ? Math.max(0.12, Math.abs(Math.cos(mv * Math.PI))) : 1;
    const sc = pop * lerp(1, 0.8, mv);
    s.icon.parentNode.setAttribute('transform', `translate(${x} ${y}) scale(${sc * turn} ${sc})`);

    // etiqueta
    const lp = easeOutCubic(prog(t, a + 0.65, a + 1.15));
    const lp2 = easeOutCubic(prog(t, 6.55, 7.1));
    const phase2 = t > T_MOVE0;
    const top = i < 2;
    const lx = phase2 ? x2 : tx;
    const ly = phase2 ? (top ? y2 - CR - 76 : y2 + CR + 58) : ty + 200;
    const lop = phase2 ? lp2 : lp * fadeOut;
    const ls = phase2 ? 0.8 : 1;
    const track = phase2 ? (1 - lp2) : (1 - lp);
    s.label.setAttribute('transform', `translate(${lx} ${ly + (1 - (phase2 ? lp2 : lp)) * 20}) scale(${ls})`);
    s.label.setAttribute('opacity', lop);
    s.l1.setAttribute('letter-spacing', 10 + track * 30);
    s.l2.setAttribute('letter-spacing', 2 + track * 18);

    idle(s, t, t > a + 0.95);

    // círculos de la composición final (se dibujan como en la referencia)
    const cp = easeInOut(prog(t, 5.85 + i * 0.12, 6.75 + i * 0.12));
    const C = 2 * Math.PI * CR;
    s.circ.setAttribute('stroke-dasharray', C);
    s.circ.setAttribute('stroke-dashoffset', C * (1 - cp));
    s.circ.setAttribute('transform', `rotate(${[-140, -40, 140, 40][i] + (1 - cp) * -90} ${x2} ${y2})`);
    s.circ.setAttribute('opacity', cp > 0 ? 1 : 0);
  });

  // conexiones entre series
  LINKS.forEach((L, i) => {
    const a = APPEAR(i + 1);
    const p = easeOutCubic(prog(t, a + 0.5, a + 0.95));
    L.line.setAttribute('x2', lerp(L.A[0], L.B[0], p)); L.line.setAttribute('y2', lerp(L.A[1], L.B[1], p));
    L.line.setAttribute('opacity', fadeOut);
    const na = easeOutBack(prog(t, a + 0.45, a + 0.65), 2), nb = easeOutBack(prog(t, a + 0.9, a + 1.1), 2);
    L.na.setAttribute('transform', scaleAt(L.A[0], L.A[1], Math.max(0, na))); L.na.setAttribute('opacity', fadeOut);
    L.nb.setAttribute('transform', scaleAt(L.B[0], L.B[1], Math.max(0, nb))); L.nb.setAttribute('opacity', fadeOut);
    const rp = prog(t, a + 1.0, a + 1.7);
    L.runner.setAttribute('cx', lerp(L.A[0], L.B[0], easeInOut(rp)));
    L.runner.setAttribute('cy', lerp(L.A[1], L.B[1], easeInOut(rp)));
    L.runner.setAttribute('opacity', rp > 0 && rp < 1 ? fadeOut : 0);
  });

  // punto central
  centerDot.setAttribute('transform', scaleAt(CC[0], CC[1], Math.max(0, easeOutBack(prog(t, 6.9, 7.25), 2.5))));

  // título final
  const tp = easeOutCubic(prog(t, 7.2, 7.9));
  $('title').setAttribute('opacity', tp);
  $('title').setAttribute('letter-spacing', 2 + (1 - tp) * 30);
  $('title').setAttribute('transform', `translate(0 ${(1 - tp) * 30})`);
  $('titleRule').setAttribute('transform', scaleAt(540, 1678, easeOutCubic(prog(t, 7.6, 8.1))));
}

window.DURATION = DURATION;
document.fonts.ready.then(() => {
  window.render = render;
  window.ready = true;
  if (!location.search.includes('export')) {
    const t0 = performance.now();
    const loop = now => { render(((now - t0) / 1000) % (DURATION + 1)); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  } else render(0);
});
</script>
</body>
</html>
