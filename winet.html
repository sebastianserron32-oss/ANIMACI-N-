<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Buscando WINET</title>
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #f3efe6; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// Animación 16:9 (5 s): un stickman camina por la Zona 4, se pregunta dónde está WINET,
// lo encuentra y se emociona. Render: node render.js winet.html winet_16x9.mp4 60
window.SIZE = [1920, 1080];
window.DURATION = 5;

const W = 1920, H = 1080;
const ctx = document.getElementById('c').getContext('2d');
const INK = '#1b1b1b', PAPER = '#f3efe6';
const BRAND = '#7b3cff';          // color de acento de WINET (cámbialo por el de la marca)
const GY = 860;                   // línea de fachadas
const FEET = 990;                 // línea por donde camina el stickman
const SC = 1.3;                   // escala del stickman

// ---------- utilidades ----------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const ss = k => { k = clamp(k, 0, 1); return k * k * (3 - 2 * k); };
const ramp = (t, a, b) => ss((t - a) / (b - a));
const backOut = k => { const c = 2.2; k -= 1; return 1 + (c + 1) * k * k * k + c * k * k; };
const pop = (t, t0, d = 0.28) => { const u = (t - t0) / d; return u <= 0 ? 0 : u >= 1 ? 1 : backOut(u); };
function rnd(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }

// "Boil" de dibujo a mano: el trazo tiembla ~10 veces por segundo
let BOIL = 0;
function hsh(n) { n = Math.sin(n * 127.1 + BOIL * 311.7) * 43758.5453; return n - Math.floor(n); }
function jit(x, y, k = 1.6) { return [x + (hsh(x * 0.13 + y * 0.71) - 0.5) * 2 * k, y + (hsh(y * 0.37 - x * 0.29 + 3) - 0.5) * 2 * k]; }
function sline(x1, y1, x2, y2) {
  const a = jit(x1, y1), b = jit(x2, y2), m = jit((x1 + x2) / 2, (y1 + y2) / 2, 2.4);
  ctx.moveTo(a[0], a[1]); ctx.quadraticCurveTo(m[0], m[1], b[0], b[1]);
}
function stroke(lw = 4, col = INK) { ctx.lineWidth = lw; ctx.strokeStyle = col; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke(); }
function srect(x, y, w, h, fill, lw = 4, col = INK) {
  if (fill) { ctx.fillStyle = fill; ctx.fillRect(x, y, w, h); }
  ctx.beginPath(); sline(x, y, x + w, y); sline(x + w, y, x + w, y + h); sline(x + w, y + h, x, y + h); sline(x, y + h, x, y);
  stroke(lw, col);
}
function hatch(x, y, w, h, gap = 14, col = 'rgba(0,0,0,0.13)') {
  ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip(); ctx.beginPath();
  for (let i = -h; i < w; i += gap) sline(x + i, y + h, x + i + h, y);
  stroke(2, col); ctx.restore();
}

// ---------- papel (fijo en pantalla, como el video de referencia) ----------
const paper = document.createElement('canvas'); paper.width = W; paper.height = H;
(function () {
  const p = paper.getContext('2d'), r = rnd(7);
  p.fillStyle = PAPER; p.fillRect(0, 0, W, H);
  const img = p.getImageData(0, 0, W, H), d = img.data;
  for (let i = 0; i < d.length; i += 4) { const n = (r() - 0.5) * 12; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
  p.putImageData(img, 0, 0);
  for (let k = 0; k < 45; k++) {             // arrugas del papel
    let x = r() * W, y = r() * H; p.beginPath(); p.moveTo(x, y);
    for (let j = 0; j < 4; j++) { x += (r() - 0.5) * 420; y += (r() - 0.5) * 320; p.lineTo(x, y); }
    p.strokeStyle = `rgba(0,0,0,${0.015 + r() * 0.03})`; p.lineWidth = 1 + r() * 1.5; p.stroke();
  }
  const g = p.createRadialGradient(W / 2, H / 2, H * 0.45, W / 2, H / 2, H * 1.15);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(70,50,20,0.20)');
  p.fillStyle = g; p.fillRect(0, 0, W, H);
})();

// ---------- recorrido y cámara (precalculado) ----------
const SPEED = 600, STRIDE = 300, X0 = 520, CMAX = 1000;
function walkW(t) {
  if (t < 1.15) return 1;
  if (t < 1.35) return 1 - ss((t - 1.15) / 0.2);
  if (t < 2.15) return 0;
  if (t < 2.35) return ss((t - 2.15) / 0.2);
  if (t < 3.10) return 1;
  if (t < 3.30) return 1 - ss((t - 3.10) / 0.2);
  return 0;
}
const DT = 1 / 600, N = Math.ceil(window.DURATION / DT) + 2;
const SX = new Float32Array(N), PH = new Float32Array(N), CX = new Float32Array(N);
(function () {
  let x = X0, p = 0, cx = 0;
  for (let i = 0; i < N; i++) {
    const w = walkW(i * DT);
    x += SPEED * w * DT; p += SPEED * w * DT / STRIDE * Math.PI * 2;
    cx += (clamp(x - X0, 0, CMAX) - cx) * (1 - Math.exp(-DT / 0.12));
    SX[i] = x; PH[i] = p; CX[i] = cx;
  }
})();

// ---------- fondo lejano (parallax) ----------
const SKY = []; (function () { const r = rnd(3); let x = -150; while (x < 2700) { const w = 130 + r() * 150; SKY.push([x, w, 230 + r() * 300]); x += w + 10 + r() * 40; } })();
function drawSkyline(cam) {
  ctx.save(); ctx.translate(-cam * 0.15, 0);       // nubes
  for (const [x, y, s] of [[260, 150, 1], [980, 110, 0.8], [1650, 170, 1.1], [2300, 120, 0.9]]) {
    ctx.beginPath();
    ctx.moveTo(x - 90 * s, y + 20 * s);
    ctx.bezierCurveTo(x - 110 * s, y - 20 * s, x - 50 * s, y - 40 * s, x - 20 * s, y - 20 * s);
    ctx.bezierCurveTo(x, y - 60 * s, x + 70 * s, y - 50 * s, x + 70 * s, y - 10 * s);
    ctx.bezierCurveTo(x + 120 * s, y - 10 * s, x + 120 * s, y + 25 * s, x + 80 * s, y + 20 * s);
    ctx.closePath(); ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.fill(); stroke(3, '#bdb6a8');
  }
  ctx.restore();
  ctx.save(); ctx.translate(-cam * 0.35, 0);
  for (const [x, w, h] of SKY) {
    srect(x, GY - h, w, h, '#e3ded3', 3, '#bbb3a5');
    ctx.fillStyle = '#d3cdc0';
    for (let yy = GY - h + 24; yy < GY - 30; yy += 38) for (let xx = x + 16; xx < x + w - 24; xx += 32) ctx.fillRect(xx, yy, 14, 18);
  }
  ctx.restore();
}

// ---------- elementos de la calle (Zona 4) ----------
function buildingConcrete(x, w, top) {           // concreto con columnas onduladas y ventanería negra
  srect(x, top, w, GY - top, '#e7e3db', 5);
  srect(x - 10, top, w + 20, 34, '#d9d4ca', 5);  // losa superior
  const lw = w * 0.42;
  srect(x + 16, top + 34, lw - 16, GY - top - 54, '#c9d2d4', 3);
  hatch(x + 16, top + 34, lw - 16, GY - top - 54, 18, 'rgba(0,0,0,0.08)');
  for (let i = 0; i < 3; i++) {                  // columnas curvas
    const cx = x + 50 + i * (lw - 40) / 2.6, bw = 46, sw = (i - 1) * 22 + 14;
    ctx.beginPath();
    ctx.moveTo(cx - bw / 2, GY - 20);
    ctx.bezierCurveTo(cx - bw / 2 + sw, GY - 180, cx - bw / 2 - sw, top + 160, cx - bw / 2 + sw * 0.4, top + 34);
    ctx.lineTo(cx + bw / 2 + sw * 0.4, top + 34);
    ctx.bezierCurveTo(cx + bw / 2 - sw, top + 160, cx + bw / 2 + sw, GY - 180, cx + bw / 2, GY - 20);
    ctx.closePath(); ctx.fillStyle = '#ddd8ce'; ctx.fill(); stroke(5);
    ctx.beginPath(); ctx.moveTo(cx + 8, GY - 30); ctx.bezierCurveTo(cx + 8 + sw, GY - 180, cx + 8 - sw, top + 160, cx + 8 + sw * 0.4, top + 44); stroke(2, 'rgba(0,0,0,0.25)');
  }
  const gx = x + lw + 10, gw = w - lw - 26, cols = 4, rows = 5, ph = (GY - top - 54) / rows, pw = gw / cols;
  srect(gx, top + 34, gw, GY - top - 54, '#cfdde0', 3);
  ctx.beginPath();
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {   // reflejos
    const px = gx + c * pw, py = top + 34 + r * ph; sline(px + pw * 0.2, py + ph * 0.75, px + pw * 0.55, py + ph * 0.2);
  }
  stroke(3, 'rgba(255,255,255,0.9)');
  ctx.beginPath();
  for (let c = 0; c <= cols; c++) sline(gx + c * pw, top + 34, gx + c * pw, GY - 20);
  for (let r = 0; r <= rows; r++) sline(gx, top + 34 + r * ph, gx + gw, top + 34 + r * ph);
  stroke(7);
  for (const [c, r] of [[0, 1], [3, 1], [2, 3]]) {   // ventanas abatibles abiertas
    const px = gx + c * pw, py = top + 34 + r * ph;
    ctx.beginPath(); ctx.moveTo(px + 6, py + 6); ctx.lineTo(px + pw - 6, py + 6); ctx.lineTo(px + pw - 16, py + ph * 0.45); ctx.lineTo(px + 16, py + ph * 0.45); ctx.closePath();
    ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fill(); stroke(5);
  }
  srect(x - 20, GY - 20, w + 40, 20, '#d6d1c7', 4);  // grada
}
function houseOrange(x, w, top) {
  srect(x, top, w, GY - top, '#ece3d3', 5);
  for (let i = 0; i < 6; i++) srect(x + 20 + i * (w - 40) / 6, top + 60, (w - 40) / 6 - 14, GY - top - 60, '#e47a3f', 3);
  ctx.beginPath(); sline(x - 30, top, x + w + 30, top); sline(x - 30, top, x - 10, top - 30); sline(x - 10, top - 30, x + w + 10, top - 30); sline(x + w + 10, top - 30, x + w + 30, top); stroke(5);
}
function graffitiWall(x, w, h) {
  const top = GY - h;
  ctx.fillStyle = '#fbfaf6'; ctx.fillRect(x, top, w, h);
  const r = rnd(11), cols = ['#e64b3c', '#f2b632', '#3f8fd2', '#2bb3a3', '#e85fa4', '#7d4bd6'];
  ctx.save(); ctx.beginPath(); ctx.rect(x, top, w, h); ctx.clip();
  for (let i = 0; i < 16; i++) {
    const bx = x + r() * w, by = top + r() * h, s = 30 + r() * 60;
    ctx.beginPath(); ctx.moveTo(bx - s, by);
    ctx.bezierCurveTo(bx - s, by - s * (0.6 + r()), bx + s * r(), by - s, bx + s, by - s * 0.2);
    ctx.bezierCurveTo(bx + s * 1.2, by + s * 0.8, bx - s * 0.3, by + s * r(), bx - s, by);
    ctx.fillStyle = cols[i % cols.length]; ctx.fill(); stroke(3);
  }
  ctx.save(); ctx.translate(x + w * 0.5, top + h * 0.62); ctx.rotate(-0.07);
  ctx.font = 'italic 900 78px Inter'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = 12; ctx.strokeStyle = INK; ctx.strokeText('ZONA 4', 0, 0);
  ctx.fillStyle = '#ffd23f'; ctx.fillText('ZONA 4', 0, 0);
  ctx.restore(); ctx.restore();
  srect(x, top, w, h, null, 5);
  hedge(x - 10, w + 20, top + 6, 46);
}
function hedge(x, w, base, h) {
  ctx.beginPath(); ctx.moveTo(x, base);
  const n = Math.round(w / 46);
  for (let i = 0; i < n; i++) { const a = x + i * w / n, b = a + w / n; ctx.quadraticCurveTo((a + b) / 2, base - h - (i % 2) * 10, b, base); }
  ctx.closePath(); ctx.fillStyle = '#86b65a'; ctx.fill(); stroke(4);
  ctx.beginPath(); for (let i = 0; i < n; i++) { const a = x + i * w / n + 14; ctx.moveTo(a, base - h * 0.45); ctx.quadraticCurveTo(a + 6, base - h * 0.7, a + 12, base - h * 0.45); }
  stroke(2.5, '#557d33');
}
function container(x, w, top) {
  srect(x, top, w, GY - top, '#f0c23a', 5);
  ctx.beginPath(); for (let xx = x + 14; xx < x + w - 6; xx += 16) sline(xx, top + 12, xx, GY - 12); stroke(2, 'rgba(0,0,0,0.3)');
}
function office(x, w, top) {
  srect(x, top, w, GY - top, '#dfe2e1', 5);
  const cols = 5, cw = (w - 60) / cols;
  for (let yy = top + 40; yy < GY - 120; yy += 92) {
    for (let c = 0; c < cols; c++) srect(x + 30 + c * cw + 6, yy, cw - 12, 62, '#a9c6d8', 3);
    ctx.beginPath(); sline(x, yy + 76, x + w, yy + 76); stroke(3);
  }
  srect(x + 40, GY - 110, w - 80, 110, '#bcd3df', 4);
  ctx.beginPath(); for (let i = 1; i < 4; i++) sline(x + 40 + i * (w - 80) / 4, GY - 110, x + 40 + i * (w - 80) / 4, GY); stroke(5);
}
function brick(x, w, top) {
  srect(x, top, w, GY - top, '#cf7a5c', 5);
  ctx.beginPath(); for (let yy = top + 20; yy < GY; yy += 22) sline(x, yy, x + w, yy); stroke(1.5, 'rgba(0,0,0,0.18)');
  for (let yy = top + 50; yy < GY - 140; yy += 120) for (let xx = x + 40; xx < x + w - 90; xx += 130) srect(xx, yy, 80, 80, '#e9e3d6', 4);
}
function streetSign(x) {
  ctx.beginPath(); sline(x, FEET - 60, x, GY - 300); stroke(7);
  ctx.save(); ctx.translate(x, GY - 300); ctx.rotate(-0.03);
  srect(-95, -36, 190, 64, '#2a62b8', 5);
  ctx.font = '800 34px Inter'; ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('ZONA 4', 0, -3);
  srect(-80, 40, 160, 46, '#2f9a5a', 4);
  ctx.font = '800 26px Inter'; ctx.fillText('4a Av. →', 0, 63);
  ctx.restore();
}
function tree(x, hgt, seed, t) {
  const base = GY + 34, top = base - hgt, r = rnd(seed);
  ctx.beginPath(); ctx.moveTo(x - 12, base); ctx.quadraticCurveTo(x - 4, base - hgt * 0.5, x - 6, top);
  ctx.lineTo(x + 6, top); ctx.quadraticCurveTo(x + 6, base - hgt * 0.5, x + 12, base); ctx.closePath();
  ctx.fillStyle = '#b9a588'; ctx.fill(); stroke(4);
  ctx.fillStyle = '#fbfaf6'; ctx.fillRect(x - 11, base - 70, 22, 66);  // tronco pintado de cal
  ctx.beginPath(); sline(x - 11, base - 70, x + 11, base - 70); stroke(3);
  ctx.beginPath(); sline(x, top + 40, x - 70, top - 30); sline(x, top + 70, x + 80, top - 10); sline(x, top, x + 10, top - 80); stroke(6);
  const blobs = [];
  for (let i = 0; i < 9; i++) blobs.push([x + (r() - 0.5) * 230, top - 70 + (r() - 0.5) * 120, 55 + r() * 35, r() * 6]);
  const sway = k => Math.sin(t * 2.2 + k) * 3;
  ctx.fillStyle = INK; for (const [bx, by, br, k] of blobs) { ctx.beginPath(); ctx.arc(bx + sway(k), by, br + 5, 0, 7); ctx.fill(); }
  ctx.fillStyle = '#9cc46f'; for (const [bx, by, br, k] of blobs) { ctx.beginPath(); ctx.arc(bx + sway(k), by, br, 0, 7); ctx.fill(); }
  ctx.beginPath();
  for (const [bx, by, br, k] of blobs) for (let j = 0; j < 3; j++) { const a = k + j * 2.1, lx = bx + sway(k) + Math.cos(a) * br * 0.5, ly = by + Math.sin(a) * br * 0.5; ctx.moveTo(lx - 8, ly); ctx.quadraticCurveTo(lx, ly - 9, lx + 8, ly); }
  stroke(3, '#6f9a49');
}
function bollard(x) {
  const b = GY + 40;
  ctx.beginPath(); ctx.moveTo(x - 17, b); ctx.lineTo(x - 17, b - 64); ctx.quadraticCurveTo(x, b - 80, x + 17, b - 64); ctx.lineTo(x + 17, b); ctx.closePath();
  ctx.fillStyle = '#fdfcf8'; ctx.fill(); stroke(4);
  ctx.beginPath(); sline(x - 17, b - 50, x + 17, b - 50); stroke(2, 'rgba(0,0,0,0.3)');
}
function planter(x, w) { srect(x, GY + 4, w, 30, '#c8c2b6', 4); hedge(x + 4, w - 8, GY + 6, 40); }
function pavement(cam) {
  ctx.fillStyle = '#dcd7cc'; ctx.fillRect(cam - 50, GY, W + 100, H - GY);
  ctx.beginPath();
  for (let r = 0, y = GY + 26; y < 1040; r++, y += 26 + r * 2) {
    const sx = Math.floor((cam - 60) / 60) * 60 + (r % 2) * 30;
    sline(cam - 50, y, cam + W + 50, y);
    for (let x = sx; x < cam + W + 60; x += 60) { ctx.moveTo(x, y - 26 - r * 2 + 2); ctx.lineTo(x, y); }
  }
  stroke(2, 'rgba(0,0,0,0.13)');
  ctx.fillStyle = '#c9c4b9'; ctx.fillRect(cam - 50, 1040, W + 100, 40);
  ctx.beginPath(); sline(cam - 50, GY, cam + W + 50, GY); stroke(6);
  ctx.beginPath(); sline(cam - 50, 1040, cam + W + 50, 1040); stroke(4);
}

// ---------- WINET ----------
const WX = 2150, WW = 650, WTOP = 290;
const SIGN = { x: WX + 55, y: WTOP + 56, w: WW - 110, h: 160 };
function winet(t) {
  const lit = t < 3.3 ? 0 : (t < 3.55 ? ((Math.floor(t * 30) % 3) ? 1 : 0.25) : 1);   // parpadeo de neón al encenderse
  srect(WX, WTOP, WW, GY - WTOP, '#efebe3', 6);
  srect(WX - 14, WTOP - 26, WW + 28, 30, '#2a2737', 5);
  // rayos de brillo
  if (lit) {
    const cx = SIGN.x + SIGN.w / 2, cy = SIGN.y + SIGN.h / 2, k = 1 + 0.12 * Math.sin(t * 14);
    ctx.beginPath();
    for (let i = 0; i < 14; i++) {
      const a = i / 14 * Math.PI * 2, r1 = 300 * k, r2 = 360 * k;
      ctx.moveTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1 * 0.55); ctx.lineTo(cx + Math.cos(a) * r2, cy + Math.sin(a) * r2 * 0.55);
    }
    stroke(7, BRAND);
  }
  srect(SIGN.x, SIGN.y, SIGN.w, SIGN.h, '#232031', 6);
  ctx.save();
  ctx.font = '900 128px Inter'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (lit) { ctx.shadowColor = BRAND; ctx.shadowBlur = 38 * lit; }
  ctx.fillStyle = lit ? '#ffffff' : '#4a4560';
  ctx.fillText('WINET', SIGN.x + SIGN.w / 2, SIGN.y + SIGN.h / 2 + 6);
  if (lit) { ctx.shadowBlur = 12; ctx.fillText('WINET', SIGN.x + SIGN.w / 2, SIGN.y + SIGN.h / 2 + 6); }
  ctx.restore();
  ctx.fillStyle = lit ? BRAND : '#3a3550'; ctx.fillRect(SIGN.x + 30, SIGN.y + SIGN.h - 22, SIGN.w - 60, 8);
  // ventanas del segundo nivel
  for (let i = 0; i < 4; i++) srect(WX + 50 + i * 142, WTOP + 250, 110, 100, lit ? '#efe6ff' : '#cfdde0', 4);
  // toldo
  ctx.beginPath(); ctx.moveTo(WX + 40, GY - 270); ctx.lineTo(WX + WW - 40, GY - 270); ctx.lineTo(WX + WW - 20, GY - 225); ctx.lineTo(WX + 20, GY - 225); ctx.closePath();
  ctx.fillStyle = BRAND; ctx.fill(); stroke(5);
  ctx.save(); ctx.clip(); ctx.fillStyle = 'rgba(255,255,255,0.85)';
  for (let xx = WX + 20; xx < WX + WW; xx += 60) { ctx.beginPath(); ctx.moveTo(xx, GY - 270); ctx.lineTo(xx + 30, GY - 270); ctx.lineTo(xx + 34, GY - 225); ctx.lineTo(xx + 4, GY - 225); ctx.fill(); }
  ctx.restore();
  // fachada de vidrio y puerta
  srect(WX + 40, GY - 220, WW - 80, 220, lit ? '#ece2ff' : '#cfdde0', 4);
  ctx.beginPath(); for (const xx of [WX + 180, WX + 260, WX + 390, WX + 470]) sline(xx, GY - 220, xx, GY); stroke(7);
  srect(WX + 270, GY - 200, 110, 200, '#2a2737', 5);
  ctx.beginPath(); sline(WX + 325, GY - 200, WX + 325, GY); stroke(4, '#8f88a8');
  ctx.fillStyle = '#d9c46a'; ctx.fillRect(WX + 308, GY - 105, 8, 30); ctx.fillRect(WX + 334, GY - 105, 8, 30);
  srect(WX - 20, GY - 16, WW + 40, 16, '#d6d1c7', 4);
  for (const px of [WX + 215, WX + 435]) {   // macetas
    srect(px - 22, GY - 60, 44, 56, '#c86b4a', 4);
    ctx.fillStyle = INK; for (const [dx, dy, r] of [[0, -84, 24], [-16, -70, 18], [16, -70, 18]]) { ctx.beginPath(); ctx.arc(px + dx, GY + dy, r + 4, 0, 7); ctx.fill(); }
    ctx.fillStyle = '#86b65a'; for (const [dx, dy, r] of [[0, -84, 24], [-16, -70, 18], [16, -70, 18]]) { ctx.beginPath(); ctx.arc(px + dx, GY + dy, r, 0, 7); ctx.fill(); }
  }
}
const CONF = []; (function () {
  const r = rnd(21), cols = [BRAND, '#ffd23f', '#e64b3c', '#2bb3a3', '#3f8fd2', '#e85fa4'];
  for (let i = 0; i < 70; i++) CONF.push({ vx: (r() - 0.5) * 1100, vy: -350 - r() * 650, c: cols[i % cols.length], s: r() * 6, w: 10 + r() * 10, d: r() * 0.25 });
})();
function confetti(t) {
  const ox = SIGN.x + SIGN.w / 2, oy = SIGN.y + SIGN.h / 2;
  for (const p of CONF) {
    const u = t - 3.4 - p.d; if (u < 0) continue;
    const x = ox + p.vx * u, y = oy + p.vy * u + 0.5 * 1100 * u * u;
    if (y > H + 40) continue;
    ctx.save(); ctx.translate(x, y); ctx.rotate(p.s + u * 9); ctx.scale(1, Math.cos(u * 12 + p.s));
    ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -5, p.w, 10); ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.strokeRect(-p.w / 2, -5, p.w, 10);
    ctx.restore();
  }
}
function star(x, y, s, col) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.beginPath();
  for (let i = 0; i < 8; i++) { const a = i / 8 * Math.PI * 2 - Math.PI / 2, r = i % 2 ? 9 : 26; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
  ctx.closePath(); ctx.fillStyle = col; ctx.fill(); ctx.lineWidth = 3 / s; ctx.strokeStyle = INK; ctx.stroke(); ctx.restore();
}

// ---------- stickman ----------
const L = { th: 82, sh: 82, torso: 128, ua: 62, fa: 62, head: 40, neck: 12 };
const pt = (x, y, a, l) => [x + Math.sin(a) * l, y + Math.cos(a) * l];   // ángulo medido desde "abajo", + = hacia adelante
function drawStick(x, P, t) {
  const legs = [0, 1].map(i => {
    const p = P.phase + i * Math.PI, air = clamp(P.jump / 25, 0, 1);
    let th = 0.5 * Math.sin(p) * P.walk + (i ? -0.12 : 0.14) * (1 - P.walk);
    let bend = Math.max(0, Math.cos(p)) * 1.0 * P.walk + 0.05;
    th = lerp(th, i ? -0.2 : 0.5, air); bend = lerp(bend, i ? 0.8 : 1.1, air);
    const sh = th - bend, k = pt(0, 0, th, L.th), f = pt(k[0], k[1], sh, L.sh);
    return { k, f };
  });
  const hipY = 0 - Math.max(legs[0].f[1], legs[1].f[1]) - P.jump;
  const lean = 0.1 * P.walk + 0.05 * P.think - 0.06 * P.cheer;
  const hx = x, hy = hipY;
  const [sx, sy] = [hx + Math.sin(lean) * L.torso, hy - Math.cos(lean) * L.torso];
  const hd = L.neck + L.head, tilt = lean + 0.12 * P.think - 0.1 * P.cheer;
  const [cx, cy] = [sx + Math.sin(tilt) * hd, sy - Math.cos(tilt) * hd];

  // sombra
  const sc = 1 - P.jump / 260;
  ctx.fillStyle = `rgba(0,0,0,${0.16 * sc})`; ctx.beginPath(); ctx.ellipse(x + 6, 6, 70 * sc, 12 * sc, 0, 0, 7); ctx.fill();

  ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = INK; ctx.lineWidth = 11;
  ctx.beginPath();
  for (const g of legs) { ctx.moveTo(hx, hy); ctx.lineTo(hx + g.k[0], hy + g.k[1]); ctx.lineTo(hx + g.f[0], hy + g.f[1]); ctx.lineTo(hx + g.f[0] + 14, hy + g.f[1]); }
  ctx.moveTo(hx, hy); ctx.lineTo(sx, sy); ctx.lineTo(sx + Math.sin(tilt) * L.neck, sy - Math.cos(tilt) * L.neck);
  ctx.stroke();

  // cabeza
  ctx.beginPath(); ctx.arc(cx, cy, L.head, 0, 7); ctx.fillStyle = '#fbfaf6'; ctx.fill(); ctx.lineWidth = 10; ctx.stroke();
  const lk = P.look;
  ctx.fillStyle = INK;
  if (P.joy > 0.5) {
    ctx.beginPath();
    for (const ex of [cx + lk * 6, cx + lk * 24]) { ctx.moveTo(ex - 8, cy - 4); ctx.lineTo(ex, cy - 13); ctx.lineTo(ex + 8, cy - 4); }
    ctx.lineWidth = 5; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx + lk * 2, cy + 6); ctx.quadraticCurveTo(cx + lk * 16, cy + 36, cx + lk * 32, cy + 4); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#e8566a'; ctx.beginPath(); ctx.arc(cx + lk * 18, cy + 18, 7, 0, 7); ctx.fill();
  } else {
    const blink = (t > 0.8 && t < 0.88) || (t > 2.7 && t < 2.78);
    for (const ex of [cx + lk * 8, cx + lk * 25]) {
      if (blink) { ctx.fillRect(ex - 5, cy - 7, 10, 4); }
      else { ctx.beginPath(); ctx.arc(ex, cy - 6 + P.think * 3, 5.5, 0, 7); ctx.fill(); }
    }
    if (P.think > 0.3) {   // boca pensativa
      ctx.beginPath(); ctx.moveTo(cx + lk * 8, cy + 18); ctx.quadraticCurveTo(cx + lk * 16, cy + 12, cx + lk * 24, cy + 18); ctx.lineWidth = 4; ctx.stroke();
    }
  }

  // brazos (después de la cabeza para que la mano quede sobre la barbilla)
  ctx.lineWidth = 11; ctx.beginPath();
  for (let i = 0; i < 2; i++) {
    const p = P.phase + i * Math.PI;
    let ua = -0.55 * Math.sin(p) * P.walk + 0.08 * (1 - P.walk), fa = ua + 0.45 * P.walk + 0.25 * (1 - P.walk);
    ua = lerp(ua, i ? -0.1 : 0.9, P.think); fa = lerp(fa, i ? 1.9 : Math.PI + 0.5, P.think);
    const wave = Math.sin(t * 22 + i * 1.7) * 0.2;
    const cU = i ? -(Math.PI - 0.6) : Math.PI - 0.6;
    ua = lerp(ua, cU, P.cheer); fa = lerp(fa, cU + (i ? 0.35 : -0.35) + wave, P.cheer);
    const e = pt(sx, sy + 4, ua, L.ua), hnd = pt(e[0], e[1], fa, L.fa);
    ctx.moveTo(sx, sy + 4); ctx.lineTo(e[0], e[1]); ctx.lineTo(hnd[0], hnd[1]);
  }
  ctx.stroke();
  return { cx, cy };
}

// signos ? y !
function mark(ch, x, y, s, rot, fill, alpha = 1) {
  if (s <= 0.01 || alpha <= 0) return;
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
  ctx.font = '900 150px Inter'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = 14; ctx.strokeStyle = INK; ctx.lineJoin = 'round'; ctx.strokeText(ch, 0, 0);
  ctx.fillStyle = fill; ctx.fillText(ch, 0, 0);
  ctx.restore();
}

// ---------- fotograma ----------
window.render = function (t) {
  BOIL = Math.floor(t * 10);
  const i = clamp(Math.round(t / DT), 0, N - 1), x = SX[i], cam = CX[i];
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(paper, 0, 0);
  drawSkyline(cam);

  ctx.save(); ctx.translate(-cam, 0);
  buildingConcrete(-60, 600, 320);
  houseOrange(640, 600, 520);
  graffitiWall(620, 640, 160);
  container(1275, 150, GY - 250);
  office(1450, 560, 230);
  winet(t);
  brick(2840, 480, 400);
  pavement(cam);
  for (let bx = 60; bx < 3300; bx += 150) if (bx < WX + 240 || bx > WX + 420) bollard(bx);
  planter(1270, 170); planter(2860, 200);
  streetSign(2070);
  tree(150, 430, 1, t); tree(900, 470, 2, t); tree(1530, 420, 5, t); tree(3020, 440, 4, t);

  // pose
  const walk = walkW(t);
  const think = ramp(t, 1.22, 1.4) - ramp(t, 2.05, 2.22);
  const cheer = ramp(t, 3.42, 3.56);
  let jump = 0; for (const s of [3.56, 4.06, 4.56]) if (t >= s && t < s + 0.42) jump = 100 * Math.sin(Math.PI * (t - s) / 0.42);
  const look = 1 - 2 * (ramp(t, 1.5, 1.62) - ramp(t, 1.86, 1.98));
  const joy = t > 3.42 ? 1 : 0;
  ctx.save(); ctx.translate(x, FEET); ctx.scale(SC, SC);
  const hd = drawStick(0, { phase: PH[i], walk, think, cheer, jump, look, joy }, t);
  ctx.restore();
  const head = { cx: x + hd.cx * SC, cy: FEET + hd.cy * SC };

  // ? mientras piensa
  const wob = Math.sin(t * 9) * 0.12;
  mark('?', head.cx + 95, head.cy - 150 + Math.sin(t * 6) * 6, pop(t, 1.3) * (1 - ramp(t, 2.2, 2.45) * 0.4), wob, '#ffffff', 1 - ramp(t, 2.25, 2.45));
  if (think > 0.5) {   // rayitas de preocupación
    ctx.beginPath(); ctx.moveTo(head.cx - 44, head.cy - 82); ctx.lineTo(head.cx - 24, head.cy - 74); ctx.moveTo(head.cx - 6, head.cy - 90); ctx.lineTo(head.cx + 12, head.cy - 80); stroke(5);
  }
  // ?? mientras sigue caminando
  mark('?', head.cx + 70, head.cy - 135, 0.6 * pop(t, 2.5), -0.2 + wob, '#ffffff', 1 - ramp(t, 3.0, 3.15));
  mark('?', head.cx + 135, head.cy - 160, 0.75 * pop(t, 2.6), 0.15 - wob, '#ffffff', 1 - ramp(t, 3.0, 3.15));
  // ¡! al descubrir WINET
  mark('!', head.cx + 90, head.cy - 160, pop(t, 3.26, 0.24) * (1 + 0.08 * Math.sin(t * 20)), wob * 0.6, BRAND, 1 - ramp(t, 4.2, 4.5));

  // celebración
  if (t > 3.4) {
    confetti(t);
    const sp = [[-140, -50, 0], [150, -10, 0.15], [-90, -190, 0.3], [190, -210, 0.45], [0, -260, 0.6]];
    for (const [dx, dy, d] of sp) {
      const u = (t - 3.55 - d) % 0.9; if (t < 3.55 + d) continue;
      star(head.cx + dx, head.cy + dy, Math.sin(Math.PI * clamp(u / 0.6, 0, 1)) * 1.1, '#ffd23f');
    }
    const lu = t - 3.55;
    star(SIGN.x - 10, SIGN.y + 10, Math.max(0, Math.sin(lu * 6)) * 1.3, '#fff');
    star(SIGN.x + SIGN.w + 10, SIGN.y + SIGN.h - 10, Math.max(0, Math.sin(lu * 6 + 2)) * 1.3, '#fff');
  }
  ctx.restore();
};

// Vista previa en navegador (en exportación el render lo controla render.js)
if (!location.search.includes('export')) {
  const t0 = performance.now();
  (function loop() { window.render(((performance.now() - t0) / 1000) % (window.DURATION + 0.8)); requestAnimationFrame(loop); })();
} else window.render(0);
</script>
