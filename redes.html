<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Redes sociales animado</title>
<style>
  :root { --navy: #1e2440; --navy-2: #262d4d; --gold: #c4a35a; --gold-light: #e0c27c; --white: #ffffff; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--navy); }
  #stage {
    position: relative; width: 1080px; height: 1920px; overflow: hidden;
    background: radial-gradient(ellipse 90% 60% at 50% 42%, var(--navy-2) 0%, var(--navy) 70%);
  }
  #grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.055) 2px, transparent 2px),
      linear-gradient(90deg, rgba(255,255,255,0.055) 2px, transparent 2px);
    background-size: 60px 60px; background-position: 30px 0;
    -webkit-mask-image: radial-gradient(ellipse 85% 70% at 50% 45%, #000 40%, transparent 100%);
            mask-image: radial-gradient(ellipse 85% 70% at 50% 45%, #000 40%, transparent 100%);
  }
  svg { position: absolute; inset: 0; }
</style>
</head>
<body>
<div id="stage">
  <div id="grid"></div>
  <svg id="svg" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="igGrad" cx="0.3" cy="1.07" r="1.3">
        <stop offset="0" stop-color="#fdf497"/>
        <stop offset="0.05" stop-color="#fdf497"/>
        <stop offset="0.45" stop-color="#fd5949"/>
        <stop offset="0.6" stop-color="#d6249f"/>
        <stop offset="0.9" stop-color="#285AEB"/>

      <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
        <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#1e2440" flood-opacity="0.35"/>
      </filter>
      <filter id="cloudShadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
      </filter>
      <!-- Logos oficiales (trazados de Simple Icons, CC0) -->

0 1 8 12.0077"/>
      <path id="p-tt" d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.440-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.920-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/>
      <path id="p-wa" d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.040 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.030 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/>
    </defs>

    <g id="camera">
      <!-- Sombra en el suelo -->
      <ellipse id="ground" cx="330" cy="1808" rx="170" ry="22" fill="#000" opacity="0.25"/>

      <!-- Ondas que salen de la cabeza -->
      <circle id="ring1" cx="340" cy="1150" r="100" fill="none" stroke="#c4a35a" stroke-width="6"/>
      <circle id="ring2" cx="340" cy="1150" r="100" fill="none" stroke="#c4a35a" stroke-width="6"/>

      <!-- Stickman con gorra -->
      <g id="man" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <g id="manBody">
          <line x1="330" y1="1268" x2="330" y2="1560"/>
          <polyline points="330,1560 262,1680 240,1795 200,1798"/>
          <polyline points="330,1560 398,1680 420,1795 465,1798"/>
          <!-- brazo en la cadera -->
          <polyline points="330,1335 240,1430 290,1515"/>
          <!-- brazo pensativo: mano en la barbilla -->
          <polyline id="thinkArm" points="330,1335 450,1405 398,1268"/>
          <circle cx="398" cy="1262" r="12" fill="#ffffff"/>
        </g>
        <g id="head">
          <circle cx="330" cy="1170" r="95" fill="#1e2440"/>
          <g id="eyes" stroke="none" fill="#ffffff">
            <circle cx="358" cy="1178" r="10"/>
            <circle cx="402" cy="1178" r="10"/>
          </g>
          <path id="mouth" d="M352 1218 Q382 1240 410 1214" stroke-width="9"/>
          <!-- gorra (visera hacia la nube) -->
          <g id="cap" stroke="none">
            <path d="M228 1150 C228 1060 300 1040 340 1040 C400 1040 438 1085 440 1150 Z" fill="#c4a35a"/>
            <path d="M262 1102 C280 1070 310 1058 330 1056" stroke="#e0c27c" stroke-width="8" fill="none" stroke-linecap="round"/>
            <rect x="380" y="1138" width="140" height="26" rx="13" fill="#a8873f"/>
            <rect x="222" y="1140" width="222" height="20" rx="10" fill="#a8873f"/>
            <circle cx="335" cy="1042" r="10" fill="#e0c27c"/>
          </g>
        </g>
      </g>

      <!-- Burbujas de pensamiento -->
      <circle id="dot1" cx="462" cy="1050" r="15" fill="#ffffff"/>
      <circle id="dot2" cx="507" cy="983" r="23" fill="#ffffff"/>
      <circle id="dot3" cx="565" cy="908" r="32" fill="#ffffff"/>

      <!-- Nube -->
      <g id="cloud" filter="url(#cloudShadow)">
        <g id="cloudStroke" fill="#c4a35a"></g>
        <g id="cloudFill" fill="#ffffff"></g>
      </g>

      <!-- Iconos -->
      <g id="icons"></g>
    </g>
  </svg>
</div>

<script>
const DURATION = 7;
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
const mk = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };

// ---- Nube: unión de círculos (contorno dorado + relleno blanco) ----
const CLOUD = [[320,555,150],[460,410,175],[660,375,185],[850,470,165],[880,635,135],[720,712,152],[500,722,147],[320,685,120],[610,565,230]];
CLOUD.forEach(([x,y,r]) => { mk('circle', {cx:x, cy:y, r:r+9}, $('cloudStroke')); mk('circle', {cx:x, cy:y, r}, $('cloudFill')); });
const CLOUD_C = [600, 600];

// ---- Iconos (logos reales en insignias circulares) ----
const R = 100;
const ICONS = [
  { name: 'facebook',  x: 455, y: 455 },
  { name: 'instagram', x: 735, y: 425 },
  { name: 'tiktok',    x: 470, y: 700 },
  { name: 'whatsapp',  x: 750, y: 675 },
];
function glyph(id, parent, size, fill, dx = 0, dy = 0) {
  const s = size / 24;
  return mk('use', { href: '#' + id, fill, transform: `translate(${-size/2 + dx} ${-size/2 + dy}) scale(${s})` }, parent);
}
ICONS.forEach(ic => {
  const g = mk('g', { filter: 'url(#shadow)' }, $('icons'));
  const inner = mk('g', {}, g);
  if (ic.name === 'facebook') {
    mk('circle', { r: R - 2, fill: '#ffffff' }, inner);
    glyph('p-fb', inner, 2 * R, '#0866FF');
  } else if (ic.name === 'instagram') {
    mk('circle', { r: R, fill: 'url(#igGrad)' }, inner);
    glyph('p-ig', inner, 108, '#ffffff');
  } else if (ic.name === 'tiktok') {
    mk('circle', { r: R, fill: '#010101' }, inner);
    glyph('p-tt', inner, 104, '#25F4EE', -5, -5);
    glyph('p-tt', inner, 104, '#FE2C55', 5, 5);
    glyph('p-tt', inner, 104, '#ffffff');
  } else if (ic.name === 'whatsapp') {
    mk('circle', { r: R, fill: '#25D366' }, inner);
    glyph('p-wa', inner, 118, '#ffffff', 2, -1);
  }
  ic.g = g; ic.inner = inner;
});

// ---- Easing ----
const clamp = x => Math.min(1, Math.max(0, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeOutCubic = x => 1 - Math.pow(1 - x, 3);
const easeInOut = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const easeOutBack = (x, c1 = 1.70158) => { const c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const easeOutElastic = x => x === 0 ? 0 : x === 1 ? 1 : Math.pow(2, -10 * x) * Math.sin((x * 10 - 0.75) * (2 * Math.PI) / 3) + 1;
const scaleAt = (cx, cy, s) => `translate(${cx} ${cy}) scale(${s}) translate(${-cx} ${-cy})`;

function render(t) {
  $('grid').style.opacity = easeOutCubic(prog(t, 0, 0.7));

  // Cámara: acercamiento lento como en el video de referencia
  const cam = 1 + 0.045 * easeInOut(prog(t, 2.2, 7));
  $('camera').setAttribute('transform', scaleAt(540, 960, cam));

  // Stickman: sube desde abajo con rebote
  const mp = easeOutBack(prog(t, 0.1, 0.85), 1.4);
  const sway = t > 0.9 ? Math.sin((t - 0.9) * 2.2) * 1.6 : 0;
  $('man').setAttribute('transform', `translate(0 ${(1 - mp) * 900}) rotate(${sway} 330 1800)`);
  $('ground').setAttribute('opacity', 0.25 * easeOutCubic(prog(t, 0.4, 0.9)));
  // Asentimiento ligero de la cabeza mientras piensa
  const nod = t > 1.0 ? Math.sin((t - 1.0) * 3.1) * 2.5 : 0;
  $('head').setAttribute('transform', `rotate(${nod} 330 1260)`);
  // Parpadeos
  const blink = [1.2, 4.3, 6.2].some(b => t > b && t < b + 0.14);
  $('eyes').setAttribute('transform', blink ? scaleAt(380, 1178, 1).replace('scale(1)', 'scale(1 0.12)') : '');

  // Burbujas de pensamiento
  [['dot1', 0.85], ['dot2', 1.0], ['dot3', 1.15]].forEach(([id, s0]) => {
    const p = easeOutBack(prog(t, s0, s0 + 0.35), 2.2);
    const c = $(id); const bob = t > 2 ? Math.sin((t - 2) * 3 + s0 * 5) * 4 : 0;
    c.setAttribute('transform', `translate(0 ${bob}) ` + scaleAt(+c.getAttribute('cx'), +c.getAttribute('cy'), Math.max(0, p)));
  });

  // Nube: aparece con efecto elástico
  const cp = easeOutElastic(prog(t, 1.3, 2.3));
  const breathe = t > 2.3 ? 1 + Math.sin((t - 2.3) * 2.4) * 0.008 : 1;
  $('cloud').setAttribute('transform', scaleAt(CLOUD_C[0], CLOUD_C[1], Math.max(0, cp) * breathe));
  $('cloud').setAttribute('opacity', prog(t, 1.3, 1.45));

  // Ondas desde la cabeza
  [['ring1', 1.75], ['ring2', 2.05]].forEach(([id, s0]) => {
    const p = prog(t, s0, s0 + 0.9);
    const r = $(id);
    r.setAttribute('r', 100 + easeOutCubic(p) * 230);
    r.setAttribute('opacity', p > 0 && p < 1 ? (1 - p) * 0.7 : 0);
  });

  // Iconos: entran uno a uno con rebote elástico
  ICONS.forEach((ic, i) => {
    const s0 = 2.1 + i * 0.42;
    const p = prog(t, s0, s0 + 0.85);
    const s = Math.max(0, easeOutElastic(p));
    const rot = (1 - easeOutCubic(p)) * (i % 2 ? 25 : -25);
    const bob = t > s0 + 0.85 ? Math.sin((t - s0 - 0.85) * 2.6 + i * 1.3) * 7 : 0;
    ic.g.setAttribute('transform', `translate(${ic.x} ${ic.y + bob}) rotate(${rot}) scale(${s})`);
    ic.g.setAttribute('opacity', prog(t, s0, s0 + 0.08));
  });
}

window.render = render;
window.DURATION = DURATION;
if (!location.search.includes('export')) {
  const t0 = performance.now();
  const loop = now => { render(((now - t0) / 1000) % (DURATION + 1)); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
} else {
  render(0);
}
</script>
</body>
</html>
