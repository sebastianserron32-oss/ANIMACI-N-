<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Gráfico de barras animado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;800;900&display=block" rel="stylesheet">
<style>
  :root {
    --navy: #1e2440;
    --navy-2: #262d4d;
    --gold: #c4a35a;
    --gold-light: #e0c27c;
    --track: #474b5e;
    --white: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--navy); }
  #stage {
    position: relative; width: 1080px; height: 1920px; overflow: hidden;
    font-family: 'Montserrat', 'Liberation Sans', Arial, sans-serif;
    color: var(--white);
    background: radial-gradient(ellipse 90% 60% at 50% 42%, var(--navy-2) 0%, var(--navy) 70%);
  }
  /* Cuadrícula de fondo (como en el video de referencia) */
  #grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.055) 2px, transparent 2px),
      linear-gradient(90deg, rgba(255,255,255,0.055) 2px, transparent 2px);
    background-size: 60px 60px;
    background-position: 30px 0;
    -webkit-mask-image: radial-gradient(ellipse 85% 70% at 50% 45%, #000 40%, transparent 100%);
            mask-image: radial-gradient(ellipse 85% 70% at 50% 45%, #000 40%, transparent 100%);
  }
  #title {
    position: absolute; top: 170px; left: 0; width: 100%;
    text-align: center; font-weight: 900; font-size: 74px; letter-spacing: 1px; line-height: 1.05;
  }
  #title span { color: var(--gold); }
  #title-rule {
    position: absolute; top: 360px; left: 50%; height: 6px; width: 180px; margin-left: -90px;
    background: var(--gold); border-radius: 3px; transform-origin: center;
  }
  /* Área del gráfico */
  #chart { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  .ylabel {
    position: absolute; left: 60px; width: 130px; text-align: right;
    font-weight: 800; font-size: 34px; color: rgba(255,255,255,0.85);
    transform: translateY(-50%);
  }
  .hline {
    position: absolute; left: 215px; right: 70px; height: 2px;
    background: rgba(255,255,255,0.12); transform-origin: left center;
  }
  #yaxis {
    position: absolute; left: 212px; width: 8px; background: var(--gold);
    border-radius: 4px; transform-origin: bottom center;
  }
  #xaxis {
    position: absolute; left: 212px; right: 70px; height: 8px; background: var(--gold);
    border-radius: 4px; transform-origin: left center;
  }
  .track {
    position: absolute; background: var(--track); border-radius: 10px 10px 0 0; opacity: 0.55;
    transform-origin: bottom center;
  }
  .bar {
    position: absolute; border-radius: 10px 10px 0 0; transform-origin: bottom center;
    background: linear-gradient(180deg, var(--gold-light) 0%, var(--gold) 35%, var(--gold) 100%);
    box-shadow: 0 0 40px rgba(196,163,90,0.25);
  }
  .value {
    position: absolute; width: 300px; margin-left: -150px; text-align: center;
    font-weight: 900; font-size: 64px; color: var(--gold); letter-spacing: -1px;
    transform: translateY(-100%);
  }
  .legend {
    position: absolute; width: 262px; margin-left: -131px; text-align: center;
    font-weight: 600; font-size: 32px; line-height: 1.25;
    padding-top: 22px; border-top: 4px solid transparent; color: var(--white);
  }
</style>
</head>
<body>
<div id="stage">
  <div id="grid"></div>
  <div id="title">RESULTADOS DE<br><span>LA ENCUESTA</span></div>
  <div id="title-rule"></div>
  <div id="chart"></div>
</div>

<script>
// ====== DATOS (edita aquí) ======
const DATA = [
  { value: 46.2, label: 'La asocia solo<br>con religión<br>y fe' },
  { value: 84.6, label: 'Prefiere videos<br>informativos<br>cortos' },
  { value: 61.5, label: 'Prefiere las<br>redes sociales' },
];
const DURATION = 8; // segundos

// ====== Geometría ======
const BASE_Y = 1480;          // línea del eje X
const TOP_Y = 590;            // altura del 100 %
const PLOT_H = BASE_Y - TOP_Y;
const PLOT_L = 220, PLOT_R = 1010;
const BAR_W = 150;
const STEPS = [0, 25, 50, 75, 100];

const chart = document.getElementById('chart');
const el = (cls, css = {}) => { const d = document.createElement('div'); d.className = cls; Object.assign(d.style, css); chart.appendChild(d); return d; };

const hlines = [], ylabels = [];
STEPS.forEach(s => {
  const y = BASE_Y - PLOT_H * s / 100;
  if (s > 0) hlines.push(el('hline', { top: (y - 1) + 'px' }));
  const l = el('ylabel', { top: y + 'px' }); l.textContent = s + '%'; ylabels.push(l);
});
const yaxis = el('', { }); yaxis.id = 'yaxis';
Object.assign(yaxis.style, { top: (TOP_Y - 30) + 'px', height: (PLOT_H + 34) + 'px' });
const xaxis = el(''); xaxis.id = 'xaxis'; xaxis.style.top = (BASE_Y - 4) + 'px';

const slot = (PLOT_R - PLOT_L) / DATA.length;
const items = DATA.map((d, i) => {
  const cx = PLOT_L + slot * (i + 0.5);
  const h = PLOT_H * d.value / 100;
  const box = { left: (cx - BAR_W / 2) + 'px', width: BAR_W + 'px' };
  const track = el('track', { ...box, top: TOP_Y + 'px', height: (PLOT_H - 4) + 'px' });
  const bar = el('bar', { ...box, top: (BASE_Y - h) + 'px', height: h + 'px' });
  const value = el('value', { left: cx + 'px' });
  const legend = el('legend', { left: cx + 'px', top: (BASE_Y + 46) + 'px' });
  legend.innerHTML = d.label;
  return { d, h, track, bar, value, legend };
});

// ====== Easing ======
const clamp = (x) => Math.min(1, Math.max(0, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeOutCubic = x => 1 - Math.pow(1 - x, 3);
const easeOutQuart = x => 1 - Math.pow(1 - x, 4);
const easeOutBack = x => { const c1 = 1.4, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const fmt = v => v.toFixed(1) + '%';

// ====== Render determinista por tiempo ======
function render(t) {
  // Fondo y cuadrícula
  document.getElementById('grid').style.opacity = easeOutCubic(prog(t, 0, 0.8));

  // Título
  const tt = easeOutBack(prog(t, 0.15, 0.85));
  const title = document.getElementById('title');
  title.style.opacity = prog(t, 0.15, 0.55);
  title.style.transform = `translateY(${(1 - tt) * -60}px)`;
  document.getElementById('title-rule').style.transform = `scaleX(${easeOutCubic(prog(t, 0.6, 1.1))})`;

  // Ejes
  yaxis.style.transform = `scaleY(${easeOutCubic(prog(t, 0.6, 1.3))})`;
  xaxis.style.transform = `scaleX(${easeOutCubic(prog(t, 0.8, 1.5))})`;
  hlines.forEach((h, i) => { const p = easeOutCubic(prog(t, 0.9 + i * 0.08, 1.5 + i * 0.08)); h.style.transform = `scaleX(${p})`; h.style.opacity = p; });
  ylabels.forEach((l, i) => { const p = easeOutCubic(prog(t, 0.8 + i * 0.07, 1.3 + i * 0.07)); l.style.opacity = p; l.style.transform = `translate(${(1 - p) * -30}px, -50%)`; });

  // Barras: crecen escalonadas desde abajo (estilo del video de referencia)
  items.forEach((it, i) => {
    const start = 1.5 + i * 0.55, end = start + 1.9;
    const p = easeOutQuart(prog(t, start, end));
    it.track.style.opacity = 0.55 * easeOutCubic(prog(t, start - 0.4, start + 0.2));
    it.track.style.transform = `scaleY(${easeOutCubic(prog(t, start - 0.4, start + 0.3))})`;
    it.bar.style.transform = `scaleY(${p})`;

    // Porcentaje que sube con la barra y cuenta
    const vp = prog(t, start + 0.05, start + 0.35);
    it.value.style.opacity = vp;
    it.value.style.top = (BASE_Y - it.h * p - 18) + 'px';
    it.value.textContent = fmt(it.d.value * p);
    // "pop" al terminar
    const pop = prog(t, end - 0.1, end + 0.35);
    const s = 1 + Math.sin(pop * Math.PI) * 0.12;
    it.value.style.transform = `translateY(-100%) scale(${s})`;

    // Leyenda
    const lp = easeOutCubic(prog(t, start + 0.2, start + 0.8));
    it.legend.style.opacity = lp;
    it.legend.style.transform = `translateY(${(1 - lp) * 30}px)`;

    // Brillo suave durante la pausa final
    const glow = t > end ? 0.25 + 0.15 * Math.sin((t - end) * 3) : 0.25 * p;
    it.bar.style.boxShadow = `0 0 50px rgba(196,163,90,${glow.toFixed(3)})`;
  });
}

window.render = render;
window.DURATION = DURATION;

// Vista previa en navegador: reproduce en bucle (desactivado al exportar con ?export)
if (!location.search.includes('export')) {
  const t0 = performance.now();
  const loop = now => { render(((now - t0) / 1000) % (DURATION + 1)); requestAnimationFrame(loop); };
  document.fonts.ready.then(() => requestAnimationFrame(loop));
} else {
  render(0);
}
</script>
</body>
</html>
